<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prediction Result</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(to right, #2c3e50, #3498db);
        }
        .result-container {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }
        h2 {
            color: #2c3e50;
            margin-bottom: 20px;
        }
        .result {
            font-size: 2rem;
            color: {% if result == 'Survived' %}#2ecc71{% else %}#e74c3c{% endif %};
            margin-bottom: 15px;
        }
        .probability {
            font-size: 1.2rem;
            color: #2c3e50;
        }
        button {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>
    <div class="result-container">
        <h2>Prediction Result</h2>
        <div class="result">{{ result }}</div>
        <div class="probability">Probability: {{ "%.2f"|format(probability) }}%</div>
        <button onclick="window.location.href='/'">New Prediction</button>
    </div>
</body>
</html>

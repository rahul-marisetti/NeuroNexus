<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Titanic Survival Predictor</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            flex-direction: column;
            text-align: center;
            background: linear-gradient(to right, #2c3e50, #3498db);
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            color: white;
        }
        p {
            font-size: 1.2rem;
            color: #ecf0f1;
            margin-bottom: 20px;
        }
        button {
            padding: 15px 30px;
            background-color: #e74c3c;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1.2rem;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #c0392b;
        }
    </style>
</head>
<body>
    <h1>Titanic Survival Predictor</h1>
    <p>Discover if a passenger would have survived the Titanic disaster</p>
    <button onclick="window.location.href='/analysis'">Start Prediction</button>
</body>
</html>
